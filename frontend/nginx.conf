server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    root /config/www;
    index index.html;

    server_name _;

    include /config/nginx/ssl.conf;

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}