name: ai_knowledge_workspace
description: Flutter client for AI Knowledge Workspace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.1
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  dio: ^5.6.0
  flutter_svg: ^2.0.17

  cupertino_icons: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
