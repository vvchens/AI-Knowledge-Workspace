version: '3.9'

services:
  backend:
    build:
      context: ./backend
    ports:
      - '8000:8000'
    environment:
      APP_NAME: 'AI Knowledge Workspace'
      ENVIRONMENT: development
      DEV: '${DEV:-0}'
    volumes:
      - ./backend/app:/app/app

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_knowledge_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
